<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gif API</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="home">
      <div class="menu">
        <button class="button" id="randomGifButton">Losowy Gif</button>
        <form class="form">
          <label>
            Wyszukaj po frazie:
            <input type="text" placeholder="Wpisz..." id="phraseInput" />
          </label>
          <button id="searchButton" type="submit" class="button">Szukaj</button>
        </form>
      </div>
      <div class="gif_container">
        <img id="gif" class="gif" />
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
